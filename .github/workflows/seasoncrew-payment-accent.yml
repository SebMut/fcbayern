name: SeasonCrew payment accent patch

on:
  push:
    paths:
      - '.github/workflows/seasoncrew-payment-accent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply raspberry payment accents
        run: python3 SeasonCrew/payment_accent_patch.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SeasonCrew/brand-v2.css SeasonCrew/index.html
          git diff --cached --quiet || git commit -m 'Style SeasonCrew payments and prices in raspberry'
          git push
