name: SeasonCrew crew delete

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/seasoncrew-crew-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump SeasonCrew UI cache
        run: python -c "from pathlib import Path; p=Path('SeasonCrew/index.html'); s=p.read_text(); s=s.replace('ui-v2.js?v=3','ui-v2.js?v=4').replace('Build guest-notes-1','Build crew-delete-1'); p.write_text(s)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/index.html
          git diff --cached --quiet || git commit -m "Bump SeasonCrew crew delete UI"
          git push
