name: SeasonCrew features v1

on:
  push:
    paths:
      - 'SeasonCrew/features-v1.js'
      - 'SeasonCrew/product-v2.js'
      - 'SeasonCrew/crew-delete.js'
      - 'SeasonCrew/history.js'
      - '.github/workflows/seasoncrew-features-v1.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check SeasonCrew/features-v1.js
          node --check SeasonCrew/product-v2.js
          node --check SeasonCrew/crew-delete.js
          node --check SeasonCrew/history.js
      - name: Confirm product v2 files
        run: test -f SeasonCrew/product-v2.js && test -f SeasonCrew/features-v1.js
