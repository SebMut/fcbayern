name: SeasonCrew robust approval

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-robust-approval.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch approval RPC
        shell: bash
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('SeasonCrew/app.js'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'approval block not found'; p.write_text(s.replace(old,new,1)); h=pathlib.Path('SeasonCrew/index.html'); x=h.read_text(); x=x.replace('Build approve-refresh-1','Build approval-fix-2').replace('./app.js?v=20260816-approve-refresh1','./app.js?v=20260816-approvalfix2'); h.write_text(x)"
      - name: Verify JavaScript syntax
        run: node --check SeasonCrew/app.js
      - name: Commit changes
        run: |
          git config user.name "SebMut"
          git config user.email "sebastian.mutter@outlook.com"
          git add SeasonCrew/app.js SeasonCrew/index.html
          git commit -m "Use robust SeasonCrew join approval RPC"
          git push
