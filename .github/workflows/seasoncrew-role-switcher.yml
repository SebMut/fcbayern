name: SeasonCrew superadmin role switcher

on:
  push:
    paths:
      - 'SeasonCrew/role-switcher.js'
      - 'SeasonCrew/role-switcher.css'
      - '.github/scripts/patch_seasoncrew_role_switcher.py'
      - '.github/workflows/seasoncrew-role-switcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply role switcher patch
        run: python .github/scripts/patch_seasoncrew_role_switcher.py
      - name: Check JavaScript syntax
        run: |
          node --check SeasonCrew/role-switcher.js
          node --check SeasonCrew/app.js
          node --check SeasonCrew/features-v1.js
          node --check SeasonCrew/product-v2.js
          node --check SeasonCrew/crew-delete.js
          node --check SeasonCrew/ui-v2.js
      - name: Commit role switcher integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/app.js SeasonCrew/features-v1.js SeasonCrew/product-v2.js SeasonCrew/crew-delete.js SeasonCrew/index.html
          git diff --cached --quiet || git commit -m "Integrate safe superadmin role views"
          git push
