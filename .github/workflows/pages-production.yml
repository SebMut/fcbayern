name: Publish sanitized GitHub Pages site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-production.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production-artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SeasonCrew/package-lock.json

      - name: Install SeasonCrew build dependencies
        working-directory: SeasonCrew
        run: npm ci

      - name: Audit SeasonCrew dependencies
        working-directory: SeasonCrew
        run: npm audit --audit-level=high

      - name: Build sanitized SeasonCrew site
        working-directory: SeasonCrew
        run: npm run build:site

      - name: Assemble repository Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='SeasonCrew/' \
            ./ _site/
          mkdir -p _site/SeasonCrew
          cp -a SeasonCrew/dist/. _site/SeasonCrew/

      - name: Verify public artifact
        run: |
          test -f _site/.nojekyll
          test -f _site/Homepage/index.html
          test -f _site/SeasonCrew/index.html
          test -f _site/SeasonCrew/app.bundle.js
          test -f _site/SeasonCrew/seasoncrew-config.js
          test ! -e _site/SeasonCrew/app.js
          test ! -e _site/SeasonCrew/package.json
          test ! -e _site/SeasonCrew/package-lock.json
          test ! -e _site/SeasonCrew/playwright.config.js
          test ! -e _site/SeasonCrew/test-accounts.html
          test ! -d _site/SeasonCrew/tests
          test ! -d _site/SeasonCrew/scripts
          if find _site/SeasonCrew -type f -name '*.py' | grep -q .; then
            echo 'Python helper leaked into SeasonCrew production artifact.'
            exit 1
          fi

      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
