name: SeasonCrew iOS settings dialog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-ios-settings-dialog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SeasonCrew/package-lock.json
      - name: Remove native dialog form behavior and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('SeasonCrew/index.html')
          s=p.read_text()
          old='<form method="dialog" class="dialogCard settingsCard" id="settingsForm">'
          new='<form class="dialogCard settingsCard" id="settingsForm" novalidate>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('settings form marker missing')
          s=re.sub(r'ui-v2\.js\?v=[^\"\']+','ui-v2.js?v=20260818-iosdialog2',s)
          s=re.sub(r'Pilot V1 · Build [^·<]+ · Multi-User','Pilot V1 · Build settings-dialog-2 · Multi-User',s)
          p.write_text(s)
          PY
      - name: Install dependencies
        working-directory: SeasonCrew
        run: npm ci
      - name: Build production artifact
        working-directory: SeasonCrew
        run: npm run build:site
      - name: Verify iOS-safe settings dialog
        run: |
          node --check SeasonCrew/ui-v2.js
          grep -q '<form class="dialogCard settingsCard" id="settingsForm" novalidate>' SeasonCrew/index.html
          grep -q 'ui-v2.js?v=20260818-iosdialog2' SeasonCrew/index.html
          grep -q 'ui-v2.js?v=20260818-iosdialog2' SeasonCrew/dist/index.html
          grep -q "dialog.id!=='settingsDialog'" SeasonCrew/ui-v2.js
          grep -q "e.target?.id==='settingsDialog'" SeasonCrew/ui-v2.js
      - name: Commit tested iOS dialog fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/index.html SeasonCrew/app.bundle.js
          git diff --cached --check
          git commit -m "Make SeasonCrew settings dialog iOS-safe"
          git pull --rebase origin main
          git push origin main
