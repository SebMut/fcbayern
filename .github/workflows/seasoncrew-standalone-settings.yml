name: SeasonCrew standalone settings page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-standalone-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SeasonCrew/package-lock.json
      - name: Route settings actions to standalone page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/app.js')
          s=p.read_text()
          old="$('settingsBtn').addEventListener('click',()=>{renderSettings();els.settingsDialog.showModal()});$('groupMenuBtn').addEventListener('click',()=>{renderSettings();els.settingsDialog.showModal()});\nels.heroInviteBtn.addEventListener('click',()=>{renderSettings();els.settingsDialog.showModal();setTimeout(()=>$('inviteAdminSettings')?.scrollIntoView({behavior:'smooth',block:'start'}),120)});"
          new="function openSettingsPage(section='profile'){if(currentGroup?.id)localStorage.setItem('seasoncrew-group',currentGroup.id);location.href=`settings.html#${section}`}\n$('settingsBtn').addEventListener('click',()=>openSettingsPage('profile'));$('groupMenuBtn').addEventListener('click',()=>openSettingsPage('crew'));\nels.heroInviteBtn.addEventListener('click',()=>openSettingsPage('invites'));"
          if old not in s: raise SystemExit('settings dialog listener marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('SeasonCrew/history.html')
          s=p.read_text()
          core='<script src="seasoncrew-core.js?v=20260817-core1"></script>'
          cfg='<script src="seasoncrew-config.js?v=20260817-prod1"></script>'
          if cfg not in s:
              if core not in s: raise SystemExit('history core marker missing')
              s=s.replace(core,cfg+'\n'+core,1)
          p.write_text(s)

          p=Path('SeasonCrew/scripts/build-site.mjs')
          s=p.read_text()
          old="const required = ['index.html', 'app.bundle.js', 'seasoncrew-core.js', 'styles.css', 'demo.html', 'history.html'];"
          new="const required = ['index.html', 'app.bundle.js', 'seasoncrew-core.js', 'styles.css', 'demo.html', 'history.html', 'settings.html', 'settings-page.js', 'settings-page.css'];"
          if old not in s: raise SystemExit('build-site required marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install dependencies
        working-directory: SeasonCrew
        run: npm ci
      - name: Build production site
        working-directory: SeasonCrew
        run: npm run build:site
      - name: Verify standalone settings architecture
        run: |
          node --check SeasonCrew/settings-page.js
          node --check SeasonCrew/app.js
          node --check SeasonCrew/app.bundle.js
          grep -q "settings.html#" SeasonCrew/app.js
          grep -q "settings.html#" SeasonCrew/app.bundle.js
          grep -q 'seasoncrew-config.js' SeasonCrew/history.html
          test -f SeasonCrew/dist/settings.html
          test -f SeasonCrew/dist/settings-page.js
          test -f SeasonCrew/dist/settings-page.css
          grep -q 'id="settingsNav"' SeasonCrew/settings.html
          if grep -q 'settingsMobileSelect' SeasonCrew/settings.html; then
            echo 'Standalone settings page must not contain duplicate dropdown navigation.'
            exit 1
          fi
      - name: Commit tested standalone settings page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/app.js SeasonCrew/app.bundle.js SeasonCrew/history.html SeasonCrew/scripts/build-site.mjs
          git diff --cached --check
          git commit -m "Route Crew settings to standalone page"
          git pull --rebase origin main
          git push origin main
