name: SeasonCrew release label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-release-label.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rename assignment release action
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('SeasonCrew/app.js')
          s=p.read_text(encoding='utf-8')
          old='<button class="releaseBtn" type="button" data-release-fixture="${m.id}" data-ticket-id="${t.id}" title="Karte freigeben">×</button>'
          if old not in s:
              raise SystemExit('old release button not found')
          s=s.replace(old,'',1)
          old_actions='<div class="ticketActions"><button type="button" data-paypal-fixture="${m.id}" data-ticket-id="${t.id}">PayPal</button>'
          new_actions='<div class="ticketActions"><button class="releaseAssignmentBtn" type="button" data-release-fixture="${m.id}" data-ticket-id="${t.id}" title="Zuweisung aufheben">Zuweisung aufheben</button><button type="button" data-paypal-fixture="${m.id}" data-ticket-id="${t.id}">PayPal</button>'
          if old_actions not in s:
              raise SystemExit('ticket actions marker not found')
          s=s.replace(old_actions,new_actions,1)
          s=s.replace("showToast('Karte konnte nicht freigegeben werden')","showToast('Zuweisung konnte nicht aufgehoben werden')")
          p.write_text(s,encoding='utf-8')

          ui=Path('SeasonCrew/ui-v2.js')
          u=ui.read_text(encoding='utf-8')
          if "==='Gast'" not in u:
              raise SystemExit('old visible member role check not found')
          u=u.replace("==='Gast'","==='Mitglied'",1)
          ui.write_text(u,encoding='utf-8')

          demo=Path('SeasonCrew/demo.js')
          d=demo.read_text(encoding='utf-8')
          d=d.replace('>Freigeben</button>','>Zuweisung aufheben</button>')
          d=d.replace(' von ${a.name} freigegeben`',' von ${a.name}: Zuweisung aufgehoben`')
          d=d.replace("toast('Karte freigegeben')","toast('Zuweisung aufgehoben')")
          demo.write_text(d,encoding='utf-8')

          css=Path('SeasonCrew/assignment-dialog.css')
          c=css.read_text(encoding='utf-8')
          extra='\n.ticketActions .releaseAssignmentBtn{white-space:nowrap;font-size:8px!important;font-weight:800!important;padding-left:7px!important;padding-right:7px!important}\n@media(max-width:560px){.ticketActions .releaseAssignmentBtn{white-space:normal;line-height:1.15}}\n'
          if '.releaseAssignmentBtn' not in c:
              c+=extra
          css.write_text(c,encoding='utf-8')
          PY

      - name: Build browser bundle
        run: |
          cp SeasonCrew/app.js /tmp/seasoncrew-app-source.js
          python - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/app.js')
          s=p.read_text()
          old="import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';"
          new="const createClient = (...args) => window.supabase.createClient(...args);"
          if old not in s: raise SystemExit('Supabase import line not found')
          p.write_text(s.replace(old,new,1))
          PY
          npx --yes esbuild@0.25.9 SeasonCrew/app.js --bundle --format=iife --target=safari15 --external:https://cdn.jsdelivr.net/* --outfile=SeasonCrew/app.bundle.js
          mv /tmp/seasoncrew-app-source.js SeasonCrew/app.js

      - name: Bump cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('SeasonCrew/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'Pilot V1 · Build [^·<]+ · Multi-User','Pilot V1 · Build release-label-1 · Multi-User',s)
          s=re.sub(r'app\.bundle\.js\?v=[^\"]+','app.bundle.js?v=20260817-release1',s)
          s=re.sub(r'ui-v2\.js\?v=[^\"]+','ui-v2.js?v=20260817-memberfix1',s)
          s=re.sub(r'assignment-dialog\.css\?v=[^\"]+','assignment-dialog.css?v=20260817-release1',s)
          p.write_text(s,encoding='utf-8')
          d=Path('SeasonCrew/demo.html')
          x=d.read_text(encoding='utf-8')
          x=re.sub(r'demo\.js\?v=[^\"]+','demo.js?v=4',x)
          d.write_text(x,encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -q 'Zuweisung aufheben' SeasonCrew/app.js
          grep -q "==='Mitglied'" SeasonCrew/ui-v2.js
          node --check SeasonCrew/app.bundle.js
          node --check SeasonCrew/ui-v2.js
          node --check SeasonCrew/demo.js

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/seasoncrew-release-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew .github/workflows/seasoncrew-release-label.yml
          git commit -m "Rename ticket release action to assignment removal"
          git push
