name: SeasonCrew optional signup invite
on:
  push:
    paths:
      - '.github/workflows/seasoncrew-auth-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch SeasonCrew auth loader to v6
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/index.html')
          s=p.read_text()
          s=s.replace('auth-fallback-v5.js?v=5','auth-fallback-v6.js?v=6')
          s=s.replace('Build username-only-1','Build signup-optional-1')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SeasonCrew/index.html
          git diff --cached --quiet || git commit -m 'Use optional SeasonCrew signup invite'
          git push
