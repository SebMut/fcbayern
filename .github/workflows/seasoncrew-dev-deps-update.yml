name: SeasonCrew dev dependency security update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-dev-deps-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update pinned development dependencies
        working-directory: SeasonCrew
        run: npm install --save-dev --save-exact @playwright/test@1.60.0 esbuild@0.28.1
      - name: Audit development dependency tree
        working-directory: SeasonCrew
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: SeasonCrew
        run: npx playwright install --with-deps chromium
      - name: Build Safari-compatible bundle
        working-directory: SeasonCrew
        run: npm run build
      - name: Run browser regression tests
        working-directory: SeasonCrew
        run: npm run test:e2e
      - name: Validate generated bundle
        run: node --check SeasonCrew/app.bundle.js
      - name: Commit tested dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/package.json SeasonCrew/package-lock.json
          git commit -m "Update SeasonCrew test and build dependencies"
          git restore SeasonCrew/app.bundle.js
          git pull --rebase origin main
          git push origin main
