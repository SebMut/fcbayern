name: SeasonCrew role label Mitglied

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-role-member-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace visible Gast role labels
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [p for p in Path('SeasonCrew').rglob('*') if p.suffix in {'.js','.html'}]
          replacements = [
            ("r==='admin'?'Admin':'Gast'", "r==='admin'?'Admin':'Mitglied'"),
            ('>Gast</option>', '>Mitglied</option>'),
            ('>Gast</span>', '>Mitglied</span>'),
            ('>Gast</b>', '>Mitglied</b>'),
            ('als Gast oder Admin', 'als Mitglied oder Admin'),
            ('Als Gast oder Admin', 'Als Mitglied oder Admin'),
            ('als Gast', 'als Mitglied'),
            ('Als Gast', 'Als Mitglied'),
            ('Gast-Ansicht', 'Mitglied-Ansicht'),
            ('Gastansicht', 'Mitgliedsansicht'),
            ('Gast · Alex', 'Mitglied · Alex'),
            ("role:'Gast'", "role:'Mitglied'"),
            ('role:"Gast"', 'role:"Mitglied"'),
            ("?'Admin':'Gast'", "?'Admin':'Mitglied'"),
            ("?'Admin':'Gast'}`", "?'Admin':'Mitglied'}`"),
            ("a.attendee_name||'Gast'", "a.attendee_name||'Ticket-Gast'"),
            ("name:'Gast Felix'", "name:'Ticket-Gast Felix'"),
            ('Oder Gastname', 'Oder Ticket-Gast'),
            ('Gastname', 'Ticket-Gast'),
          ]

          changed=[]
          for p in files:
            s=p.read_text(encoding='utf-8')
            old=s
            for a,b in replacements:
              s=s.replace(a,b)
            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('Changed:', *changed, sep='\n- ')
          PY

      - name: Ensure key labels are correct
        run: |
          grep -q "'Mitglied'" SeasonCrew/app.js
          grep -q '>Mitglied</option>' SeasonCrew/role-switcher.js
          grep -q 'Mitglied · Alex' SeasonCrew/demo.html
          grep -q "role:'Mitglied'" SeasonCrew/demo.js
          if grep -R -n -E 'als Gast|Als Gast|Gast-Ansicht|Gastansicht|>Gast</option>|>Gast</span>' SeasonCrew --include='*.js' --include='*.html'; then
            echo 'Visible Gast role wording still found'
            exit 1
          fi

      - name: Build browser bundle
        run: |
          cp SeasonCrew/app.js /tmp/seasoncrew-app-source.js
          python - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/app.js')
          s=p.read_text()
          old="import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';"
          new="const createClient = (...args) => window.supabase.createClient(...args);"
          if old not in s:
            raise SystemExit('Supabase import line not found')
          p.write_text(s.replace(old,new,1))
          PY
          npx --yes esbuild@0.25.9 SeasonCrew/app.js --bundle --format=iife --target=safari15 --external:https://cdn.jsdelivr.net/* --outfile=SeasonCrew/app.bundle.js
          mv /tmp/seasoncrew-app-source.js SeasonCrew/app.js

      - name: Bump cache keys and build label
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('SeasonCrew/index.html')
          s=p.read_text()
          s=re.sub(r'Pilot V1 · Build [^·<]+ · Multi-User', 'Pilot V1 · Build roles-1 · Multi-User', s)
          s=re.sub(r'role-switcher\.js\?v=[^\"]+', 'role-switcher.js?v=20260817-member1', s)
          s=re.sub(r'app\.bundle\.js\?v=[^\"]+', 'app.bundle.js?v=20260817-member1', s)
          p.write_text(s)
          d=Path('SeasonCrew/demo.html')
          x=d.read_text()
          x=re.sub(r'demo\.js\?v=[^\"]+', 'demo.js?v=3', x)
          d.write_text(x)
          PY

      - name: Validate JavaScript
        run: |
          node --check SeasonCrew/app.bundle.js
          node --check SeasonCrew/role-switcher.js
          node --check SeasonCrew/demo.js
          node --check SeasonCrew/demo-entry.js

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m "Rename visible guest role to member"
          git push
