name: SeasonCrew admin member removal

on:
  push:
    paths:
      - '.github/workflows/seasoncrew-admin-remove-members.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow crew admins to remove members in UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SeasonCrew/features-v1.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "const manager=isManager(),uid=session.user.id;",
              "const manager=isManager(),remover=canAllocate(),uid=session.user.id;"
          )
          old = """        actions.querySelector('[data-remove-member]')?.addEventListener('click',()=>removeMember(m.user_id,m.username));
      }
      if(m.user_id===uid&&m.role!=='owner'){"""
          new = """        actions.querySelector('[data-remove-member]')?.addEventListener('click',()=>removeMember(m.user_id,m.username));
      }
      if(remover&&!manager&&m.role!=='owner'&&m.user_id!==uid){
        const actions=document.createElement('div');actions.className='memberManageActions';
        actions.innerHTML='<button class=\"memberAction danger\" type=\"button\" data-remove-member>Entfernen</button>';
        row.appendChild(actions);
        actions.querySelector('[data-remove-member]').addEventListener('click',()=>removeMember(m.user_id,m.username));
      }
      if(m.user_id===uid&&m.role!=='owner'){"""
          if old not in s:
              raise SystemExit('member controls anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "if(!isManager())return;if(!confirm(`@${name} wirklich aus dieser Crew entfernen?`))return;",
              "if(!canAllocate())return;if(!confirm(`@${name} wirklich aus dieser Crew entfernen?`))return;",
              1
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Bump frontend cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/crew-delete.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("features-v1.js?v=1", "features-v1.js?v=2")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check SeasonCrew/features-v1.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/features-v1.js SeasonCrew/crew-delete.js
          git diff --cached --quiet || git commit -m "Allow crew admins to remove members"
          git push
