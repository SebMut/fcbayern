name: SeasonCrew mobile auth scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-mobile-auth-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix mobile auth scrolling
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('SeasonCrew/styles.css')
          s = css.read_text()
          marker = '/* SeasonCrew mobile auth scroll fix */'
          extra = '''\n/* SeasonCrew mobile auth scroll fix */\n.authScreen{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}\n@media(max-width:700px){\n  .authScreen{display:block;overflow-y:auto;overflow-x:hidden;padding:max(16px,env(safe-area-inset-top)) 14px max(32px,env(safe-area-inset-bottom));}\n  .authShell{width:100%;max-width:450px;max-height:none;margin:0 auto;padding:20px;border-radius:20px;}\n  .authBrand{margin-bottom:16px}.authTabs{margin-bottom:18px}.authForm h1{font-size:26px}.authForm>p{margin-bottom:15px}\n  .authFoot{padding-bottom:4px}\n}\n@media(max-height:700px){\n  .authScreen{align-items:start;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));}\n  .authShell{margin:0 auto}\n}\n'''
          if marker not in s:
              css.write_text(s + extra)

          html = Path('SeasonCrew/index.html')
          h = html.read_text()
          h = h.replace('styles.css?v=3', 'styles.css?v=4')
          h = h.replace('Build login-fix-8', 'Build mobile-scroll-1')
          html.write_text(h)
          PY

      - name: Commit changes
        run: |
          git config user.name "SebMut"
          git config user.email "sebastian.mutter@outlook.com"
          git add SeasonCrew/styles.css SeasonCrew/index.html
          git commit -m "Fix SeasonCrew signup scrolling on mobile"
          git push
