name: SeasonCrew interest fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-interest-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply interest fix
        run: python SeasonCrew/fix_interest_logic.py
      - name: Build browser bundle
        run: |
          cp SeasonCrew/app.js /tmp/seasoncrew-app-source.js
          python - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/app.js')
          s=p.read_text()
          old="import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';"
          new="const createClient = (...args) => window.supabase.createClient(...args);"
          if old not in s: raise SystemExit('Supabase import line not found')
          p.write_text(s.replace(old,new,1))
          PY
          npx --yes esbuild@0.25.9 SeasonCrew/app.js --bundle --format=iife --target=safari15 --external:https://cdn.jsdelivr.net/* --outfile=SeasonCrew/app.bundle.js
          mv /tmp/seasoncrew-app-source.js SeasonCrew/app.js
      - name: Validate
        run: |
          grep -q "− Interesse zurücknehmen" SeasonCrew/features-v1.js
          grep -q "data-wish-reject-user" SeasonCrew/features-v1.js
          grep -q "SeasonCrewAssignment" SeasonCrew/app.js
          grep -q "sc_ticket_wishes').delete" SeasonCrew/app.js
          grep -q "==='Mitglied'" SeasonCrew/pricing-runtime-v2.js
          node --check SeasonCrew/app.bundle.js
          node --check SeasonCrew/features-v1.js
          node --check SeasonCrew/wish-actions-v2.js
          node --check SeasonCrew/pricing-runtime-v2.js
          node --check SeasonCrew/ui-v2.js
          node --check SeasonCrew/crew-delete.js
      - name: Remove temporary migration files and commit
        run: |
          rm -f SeasonCrew/fix_interest_logic.py .github/workflows/seasoncrew-interest-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew .github/workflows/seasoncrew-interest-fix.yml
          git commit -m "Fix SeasonCrew ticket interest flow"
          git push
