name: SeasonCrew club cache bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-club-cache-bump.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh feature cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('SeasonCrew')
          p=root/'index.html';s=p.read_text()
          s=s.replace('Build club-independence-v1','Build club-independent-1')
          s=re.sub(r'club-fixtures-v1\.js\?v=[^\"]+','club-fixtures-v1.js?v=20260817-club2',s)
          p.write_text(s)
          for p in list(root.glob('*.js'))+list(root.glob('*.html')):
              s=p.read_text()
              n=re.sub(r'price-management\.js\?v=[^\"\']+','price-management.js?v=20260817-club2',s)
              n=re.sub(r'price-management\.css\?v=[^\"\']+','price-management.css?v=20260817-club2',n)
              if n!=s:p.write_text(n)
          PY
          grep -q 'club-fixtures-v1.js?v=20260817-club2' SeasonCrew/index.html
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh club-independent feature caches"
          git pull --rebase origin main
          git push origin main
