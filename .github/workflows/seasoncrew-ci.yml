name: SeasonCrew CI

on:
  push:
    branches: [main]
    paths:
      - 'SeasonCrew/**'
  pull_request:
    paths:
      - 'SeasonCrew/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SeasonCrew/package-lock.json
      - name: Install dependencies
        working-directory: SeasonCrew
        run: npm ci
      - name: Audit dependencies
        working-directory: SeasonCrew
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: SeasonCrew
        run: npx playwright install --with-deps chromium
      - name: Build deployable site
        working-directory: SeasonCrew
        run: npm run build:site
      - name: Verify shared client architecture and production artifact
        run: |
          node --check SeasonCrew/app.bundle.js
          node --check SeasonCrew/seasoncrew-config.js
          node --check SeasonCrew/seasoncrew-core.js
          node --check SeasonCrew/product-v2.js
          node --check SeasonCrew/features-v1.js
          node --check SeasonCrew/pricing-runtime-v2.js
          node --check SeasonCrew/wish-actions-v2.js
          node --check SeasonCrew/club-fixtures-v1.js
          test -f SeasonCrew/dist/index.html
          test -f SeasonCrew/dist/app.bundle.js
          test -f SeasonCrew/dist/demo.html
          test -f SeasonCrew/dist/history.html
          test -f SeasonCrew/dist/_headers
          test ! -e SeasonCrew/dist/app.js
          test ! -e SeasonCrew/dist/package.json
          test ! -e SeasonCrew/dist/package-lock.json
          test ! -e SeasonCrew/dist/playwright.config.js
          test ! -e SeasonCrew/dist/test-accounts.html
          test ! -e SeasonCrew/auth-fallback-v6.js
          test ! -e SeasonCrew/auth-fallback-v5.js
          test ! -e SeasonCrew/auth-fallback.js
          test ! -e SeasonCrew/pricing-runtime.js
          test ! -e SeasonCrew/supabase-esm-shim.js
          test ! -e SeasonCrew/app-compat-loader.js
          grep -q 'club-fixtures-v1.js' SeasonCrew/index.html
          grep -q 'sc_fixtures' SeasonCrew/app.js
          grep -q 'seasoncrew-config.js' SeasonCrew/index.html
          grep -q 'seasoncrew-config.js' SeasonCrew/dist/index.html
          grep -q 'window.SeasonCrewConfig' SeasonCrew/seasoncrew-core.js
          if grep -q 'supabase.co' SeasonCrew/seasoncrew-core.js; then
            echo 'Environment-specific Supabase URL must stay in seasoncrew-config.js.'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          for name in ('SeasonCrew/index.html','SeasonCrew/dist/index.html'):
              s=Path(name).read_text()
              if s.index('seasoncrew-config.js') > s.index('seasoncrew-core.js'):
                  raise SystemExit(f'Runtime config loads after core in {name}')
          PY
          if find SeasonCrew/dist -type f \( -name '*.py' -o -path '*/tests/*' \) | grep -q .; then
            echo 'Development files leaked into production dist.'
            exit 1
          fi
          if grep -R --include='*.js' -n "createClient(" SeasonCrew | grep -v 'SeasonCrew/seasoncrew-core.js'; then
            echo 'A second Supabase client implementation exists.'
            exit 1
          fi
          if grep -n 'auth-fallback-v' SeasonCrew/index.html; then
            echo 'Legacy auth fallback script reference exists.'
            exit 1
          fi
      - name: Browser regression tests
        working-directory: SeasonCrew
        run: npm run test:e2e
