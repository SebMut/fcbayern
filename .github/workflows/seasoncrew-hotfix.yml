name: SeasonCrew browser hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-seasoncrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make QR loading non-blocking
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('SeasonCrew/app.js')
          s=p.read_text()
          s=s.replace("import * as QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm';\n","")
          s=s.replace("  let qr='';\n", "  let qr='';try{const QRCode=await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm');qr=await QRCode.toDataURL(link,{width:260,margin:1})}catch(e){console.warn('QR-Code konnte nicht geladen werden',e)}\n", 1)
          p.write_text(s)
          h=Path('SeasonCrew/index.html')
          x=h.read_text()
          x=re.sub(r'app\.js\?v=\d+', 'app.js?v=5', x)
          h.write_text(x)
          Path('.github/workflows/seasoncrew-hotfix.yml').unlink()
      - name: Syntax check
        run: node --check SeasonCrew/app.js
      - name: Commit final hotfix
        run: |
          git config user.name "SeasonCrew Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize SeasonCrew auth startup and safe QR loading"
          git push
