name: SeasonCrew payment privacy hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-payment-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove paid from Realtime payloads
        run: python SeasonCrew/privacy_realtime_patch.py
      - name: Build browser bundle
        run: |
          cp SeasonCrew/app.js /tmp/app-source.js
          python -c "from pathlib import Path; p=Path('SeasonCrew/app.js'); s=p.read_text(); old=\"import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';\"; new=\"const createClient = (...args) => window.supabase.createClient(...args);\"; assert old in s; p.write_text(s.replace(old,new,1))"
          npx --yes esbuild@0.25.9 SeasonCrew/app.js --bundle --format=iife --target=safari15 --external:https://cdn.jsdelivr.net/* --outfile=SeasonCrew/app.bundle.js
          mv /tmp/app-source.js SeasonCrew/app.js
      - name: Validate privacy and syntax
        run: |
          node --check SeasonCrew/app.bundle.js
          node --check SeasonCrew/features-v1.js
          node --check SeasonCrew/product-v2.js
          node --check SeasonCrew/ui-v2.js
          node --check SeasonCrew/crew-delete.js
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('SeasonCrew').glob('*.js'):
              for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  if "table:'sc_allocations'" in line and "'paid'" in line and 'postgres_changes' in line:
                      bad.append(f'{p}:{i}')
          if bad:
              raise SystemExit('paid still exposed in allocation realtime: '+', '.join(bad))
          PY
      - name: Commit privacy hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew
          git commit -m "Hide payment state from allocation realtime payloads"
          git push
