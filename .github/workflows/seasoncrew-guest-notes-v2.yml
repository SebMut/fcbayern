name: SeasonCrew guest notes v2

on:
  push:
    branches: [main]
    paths:
      - 'SeasonCrew/bump-guest-note-cache.py'
      - '.github/workflows/seasoncrew-guest-notes-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump guest note UI cache
        run: python SeasonCrew/bump-guest-note-cache.py
      - name: Commit
        run: |
          git config user.name "SebMut"
          git config user.email "sebastian.mutter@outlook.com"
          git add SeasonCrew/index.html
          git diff --cached --quiet || git commit -m "Enable immutable prefixed guest notes"
          git push
