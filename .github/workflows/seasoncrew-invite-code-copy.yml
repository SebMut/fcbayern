name: SeasonCrew invite code copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-invite-code-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch invite UI
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Verify JavaScript syntax
        run: node --check SeasonCrew/app.js
      - name: Commit changes
        run: |
          git config user.name "SebMut"
          git config user.email "sebastian.mutter@outlook.com"
          git add SeasonCrew/app.js SeasonCrew/invite.css SeasonCrew/index.html
          git commit -m "Show and copy SeasonCrew invitation code"
          git push
