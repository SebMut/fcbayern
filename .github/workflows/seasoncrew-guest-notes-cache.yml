name: SeasonCrew guest notes cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-guest-notes-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump UI cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SeasonCrew/index.html')
          s = p.read_text()
          s = s.replace('ui-v2.css?v=1', 'ui-v2.css?v=2')
          s = s.replace('ui-v2.js?v=1', 'ui-v2.js?v=2')
          s = s.replace('Build username-only-1', 'Build guest-notes-1')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "SebMut"
          git config user.email "sebastian.mutter@outlook.com"
          git add SeasonCrew/index.html
          git commit -m "Enable guest fixture notes UI"
          git push
