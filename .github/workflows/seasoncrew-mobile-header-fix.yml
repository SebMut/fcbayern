name: SeasonCrew mobile header fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-mobile-header-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bump mobile header cache and verify layout rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/index.html')
          s=p.read_text()
          s=s.replace('crew-settings-button.css?v=1','crew-settings-button.css?v=20260817-mobile2')
          s=s.replace('Pilot V1 · Build settings-layout-1 · Multi-User','Pilot V1 · Build settings-layout-2 · Multi-User')
          p.write_text(s)
          css=Path('SeasonCrew/crew-settings-button.css').read_text()
          required=[
            '.topbarInner{flex-wrap:nowrap!important',
            '.groupSwitch select{width:auto!important',
            'flex:1 1 0!important',
            '.groupSwitch .crewSettingsButton{flex:0 0 34px!important'
          ]
          for marker in required:
            if marker not in css: raise SystemExit(f'Missing mobile header rule: {marker}')
          PY
      - name: Commit mobile header wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/index.html
          git diff --cached --check
          git commit -m "Keep SeasonCrew mobile header on one line"
          git pull --rebase origin main
          git push origin main
