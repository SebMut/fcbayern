name: SeasonCrew browser bundle

on:
  push:
    branches: [main]
    paths:
      - 'SeasonCrew/app.js'
      - 'SeasonCrew/schedule.js'
      - 'FcBayern_Tom/schedule.js'
      - '.github/workflows/seasoncrew-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace Supabase ESM import for browser bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SeasonCrew/app.js')
          s = p.read_text()
          old = "import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';"
          new = "const createClient = (...args) => window.supabase.createClient(...args);"
          if old not in s:
              raise SystemExit('Supabase import line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build Safari-compatible bundle
        run: |
          npx --yes esbuild@0.25.9 SeasonCrew/app.js \
            --bundle \
            --format=iife \
            --target=safari15 \
            --external:https://cdn.jsdelivr.net/* \
            --outfile=SeasonCrew/app.bundle.js

      - name: Restore source and switch HTML to bundle
        run: |
          git checkout -- SeasonCrew/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('SeasonCrew/index.html')
          s = p.read_text()
          s = s.replace('Build login-fix-5', 'Build login-fix-6')
          s = re.sub(r'\n\s*<script type="importmap">.*?</script>', '', s, flags=re.S)
          s = re.sub(r'\n\s*<script type="module">.*?</script>', '', s, flags=re.S)
          s = s.replace(
              '<script src="auth-fallback-v5.js?v=2"></script>',
              '<script src="auth-fallback-v5.js?v=3"></script>\n  <script src="app.bundle.js?v=20260816-loginfix6"></script>\n  <script>window.seasonCrewModuleLoaded=true;window.seasonCrewModuleFailed=false;</script>'
          )
          p.write_text(s)
          PY

      - name: Verify generated JavaScript
        run: node --check SeasonCrew/app.bundle.js

      - name: Commit generated browser bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/app.bundle.js SeasonCrew/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[skip ci] Build SeasonCrew Safari bundle"
          git push
