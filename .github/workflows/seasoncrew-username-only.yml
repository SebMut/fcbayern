name: SeasonCrew username only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-username-only.yml'
      - '.github/scripts/seasoncrew_username_only.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch SeasonCrew
        run: python .github/scripts/seasoncrew_username_only.py
      - name: Verify JavaScript syntax
        run: |
          node --check SeasonCrew/app.js
          node --check SeasonCrew/auth-fallback-v5.js
          node --check SeasonCrew/history.js
      - name: Commit changes
        run: |
          git config user.name "SebMut"
          git config user.email "sebastian.mutter@outlook.com"
          git add SeasonCrew/app.js SeasonCrew/auth-fallback-v5.js SeasonCrew/index.html SeasonCrew/history.js
          git commit -m "Use usernames only in SeasonCrew"
          git push
