name: SeasonCrew crew settings button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-crew-settings-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch crew settings button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/index.html')
          s=p.read_text()
          s=s.replace('<link rel="stylesheet" href="ui-v2.css?v=1">','<link rel="stylesheet" href="ui-v2.css?v=1">\n  <link rel="stylesheet" href="crew-settings-button.css?v=1">')
          s=s.replace('<button class="iconButton" id="groupMenuBtn" type="button" title="Gruppe verwalten">•••</button>','<button class="crewSettingsButton" id="groupMenuBtn" type="button" title="Crew-Einstellungen" aria-label="Crew-Einstellungen"><span class="crewSettingsGear" aria-hidden="true">⚙</span><span class="crewSettingsText">Crew-Einstellungen</span></button>')
          s=s.replace('Build guest-readonly-1','Build crew-settings-1')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "SebMut"
          git config user.email "sebastian.mutter@outlook.com"
          git add SeasonCrew/index.html
          git commit -m "Use gear button for SeasonCrew crew settings"
          git push
