name: SeasonCrew assignment dialog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-assignment-dialog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply dialog migration
        run: python SeasonCrew/migrate_assignment_dialog.py
      - name: Build browser bundle
        run: |
          cp SeasonCrew/app.js /tmp/seasoncrew-app-source.js
          python -c "from pathlib import Path; p=Path('SeasonCrew/app.js'); s=p.read_text(); old=\"import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';\"; new=\"const createClient = (...args) => window.supabase.createClient(...args);\"; assert old in s; p.write_text(s.replace(old,new,1))"
          npx --yes esbuild@0.25.9 SeasonCrew/app.js --bundle --format=iife --target=safari15 --external:https://cdn.jsdelivr.net/* --outfile=SeasonCrew/app.bundle.js
          mv /tmp/seasoncrew-app-source.js SeasonCrew/app.js
      - name: Bump cache keys
        run: |
          python -c "from pathlib import Path; import re; p=Path('SeasonCrew/index.html'); s=p.read_text(); s=re.sub(r'Pilot V1 · Build [^·<]+ · Multi-User','Pilot V1 · Build assign-dialog-1 · Multi-User',s); s=re.sub(r'app\\.bundle\\.js\\?v=[^\\\"]+','app.bundle.js?v=20260817-assign1',s); s=re.sub(r'assignment-dialog\\.css\\?v=[^\\\"]+','assignment-dialog.css?v=20260817-assign1',s); p.write_text(s)"
      - name: Validate
        run: |
          grep -q 'id="assignTicketDialog"' SeasonCrew/index.html
          grep -q 'openAssignTicket' SeasonCrew/app.js
          node --check SeasonCrew/app.bundle.js
      - name: Remove temporary migration files and commit
        run: |
          rm -f SeasonCrew/migrate_assignment_dialog.py .github/workflows/seasoncrew-assignment-dialog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew .github/workflows/seasoncrew-assignment-dialog.yml
          git commit -m "Use assignment dialog for SeasonCrew tickets"
          git push
