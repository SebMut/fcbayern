name: SeasonCrew refresh dev dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-refresh-dev-deps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update exact test and build dependencies
        working-directory: SeasonCrew
        run: npm install --save-dev --save-exact @playwright/test@1.61.1 esbuild@0.28.1
      - name: Security audit
        working-directory: SeasonCrew
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: SeasonCrew
        run: npx playwright install --with-deps chromium
      - name: Rebuild Safari bundle
        working-directory: SeasonCrew
        run: npm run build
      - name: Verify JavaScript
        run: |
          node --check SeasonCrew/app.bundle.js
          node --check SeasonCrew/seasoncrew-core.js
          node --check SeasonCrew/product-v2.js
          node --check SeasonCrew/features-v1.js
          node --check SeasonCrew/pricing-runtime-v2.js
          node --check SeasonCrew/wish-actions-v2.js
          node --check SeasonCrew/club-fixtures-v1.js
      - name: Browser regression tests
        working-directory: SeasonCrew
        run: npm run test:e2e
      - name: Refresh bundle cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('SeasonCrew/index.html')
          s=p.read_text()
          s=re.sub(r'app\.bundle\.js\?v=[^\"]+','app.bundle.js?v=deps-refresh-1',s)
          p.write_text(s)
          PY
      - name: Commit only tested dependency refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/package.json SeasonCrew/package-lock.json SeasonCrew/app.bundle.js SeasonCrew/index.html
          git diff --cached --check
          git commit -m "Update SeasonCrew test and build dependencies"
          git pull --rebase origin main
          git push origin main
