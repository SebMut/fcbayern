name: SeasonCrew invite main-flow fix

on:
  push:
    paths:
      - '.github/workflows/seasoncrew-invite-mainflow-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply invite main-flow fix
        run: python3 SeasonCrew/invite_mainflow_patch.py
      - name: Validate source JavaScript
        run: node --check SeasonCrew/app.js
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SeasonCrew/app.js SeasonCrew/index.html
          git diff --cached --quiet || git commit -m 'Fix SeasonCrew invitation link registration flow'
          git push
