name: SeasonCrew approve refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-approve-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      OLD_B64: 
      NEW_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch approval refresh
        run: python -c "import os,base64; from pathlib import Path; p=Path('SeasonCrew/app.js'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert old in s, 'decideRequest block not found'; p.write_text(s.replace(old,new,1)); h=Path('SeasonCrew/index.html'); t=h.read_text().replace('Build mobile-scroll-1','Build approve-refresh-1').replace('./app.js?v=20260816-loginfix9','./app.js?v=20260816-approve-refresh1'); h.write_text(t)"
      - name: Verify JavaScript syntax
        run: node --check SeasonCrew/app.js
      - name: Commit changes
        run: |
          git config user.name "SebMut"
          git config user.email "sebastian.mutter@outlook.com"
          git add SeasonCrew/app.js SeasonCrew/index.html
          git commit -m "Refresh SeasonCrew members immediately after approval"
          git push
