name: SeasonCrew performance pass 2

on:
  push:
    paths:
      - '.github/workflows/seasoncrew-performance-pass-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce duplicate runtime work
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('SeasonCrew/pricing-runtime-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('let client=null,pricing=null,ticketMap=new Map(),loadTimer=null,loading=false;', 'let client=null,pricing=null,ticketMap=new Map(),loadTimer=null,statsTimer=null,loading=false;', 1)
          s=s.replace('function scheduleLoad(delay=50){clearTimeout(loadTimer);loadTimer=setTimeout(loadPricing,delay)}', "function scheduleLoad(delay=50){clearTimeout(loadTimer);loadTimer=setTimeout(loadPricing,delay)}\n  function scheduleStats(delay=250){clearTimeout(statsTimer);statsTimer=setTimeout(refreshUnpaidStats,delay)}", 1)
          old="window.addEventListener('seasoncrew:rendered',()=>pricing?.groupId===groupId()?(decorateAll(),refreshUnpaidStats()):scheduleLoad(30));"
          new="window.addEventListener('seasoncrew:rendered',()=>pricing?.groupId===groupId()?(decorateAll(),scheduleStats(250)):scheduleLoad(30));"
          if old not in s: raise SystemExit('pricing render hook missing')
          s=s.replace(old,new,1)
          s=s.replace("\n  setTimeout(()=>scheduleLoad(0),700);",'',1)
          p.write_text(s,encoding='utf-8')

          p=Path('SeasonCrew/wish-actions-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("\n  window.addEventListener('seasoncrew:rendered',()=>scheduleDecorate(0));",'',1)
          p.write_text(s,encoding='utf-8')

          p=Path('SeasonCrew/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('role-switcher.js?v=5','role-switcher.js?v=6')
          s=s.replace('wish-actions-v2.js?v=20260817-1','wish-actions-v2.js?v=20260817-2')
          s=s.replace('pricing-runtime-v2.js?v=20260817-2','pricing-runtime-v2.js?v=20260817-3')
          s=s.replace('Build product-v2-6','Build product-v2-7')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check SeasonCrew/pricing-runtime-v2.js
          node --check SeasonCrew/wish-actions-v2.js
          node --check SeasonCrew/role-switcher.js
          node --check SeasonCrew/features-v1.js
      - name: Commit performance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/pricing-runtime-v2.js SeasonCrew/wish-actions-v2.js SeasonCrew/index.html
          git diff --cached --quiet || git commit -m "Improve SeasonCrew Chrome performance"
          git push
