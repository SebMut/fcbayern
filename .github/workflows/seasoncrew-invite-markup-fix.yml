name: SeasonCrew temporary helper cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-invite-markup-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time refactor helpers
        run: |
          rm -f SeasonCrew/seasoncrew_priority_roadmap_patch.py
          rm -f SeasonCrew/seasoncrew_priority_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A SeasonCrew/seasoncrew_priority_roadmap_patch.py SeasonCrew/seasoncrew_priority_cleanup.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove SeasonCrew one-time refactor helpers"
          git push
