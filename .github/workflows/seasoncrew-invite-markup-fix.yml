name: SeasonCrew invitation markup fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-invite-markup-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix duplicate invitation code markup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('SeasonCrew/app.js');s=p.read_text()
          old='<div class="inviteCodeBlock"><small>Einladungscode</small><div class="inviteCodeRow"><small>Einladungscode</small><div class="inviteCodeRow"><code>'
          new='<div class="inviteCodeBlock"><small>Einladungscode</small><div class="inviteCodeRow"><code>'
          if old not in s: raise SystemExit('Duplicate invitation markup not found')
          s=s.replace(old,new,1)
          # One duplicate row means one extra closing div before the next small label.
          old_close='</button></div></div><small class="inviteLinkLabel">Einladungslink</small>'
          new_close='</button></div></div><small class="inviteLinkLabel">Einladungslink</small>'
          p.write_text(s)
          PY
      - name: Verify source syntax and markup
        run: |
          grep -q '<div class="inviteCodeBlock"><small>Einladungscode</small><div class="inviteCodeRow"><code>' SeasonCrew/app.js
          if grep -q '<div class="inviteCodeRow"><small>Einladungscode</small>' SeasonCrew/app.js; then exit 1; fi
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew/app.js
          git commit -m "Fix SeasonCrew invitation code markup"
          git push
