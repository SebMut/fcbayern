name: SeasonCrew member ticket guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seasoncrew-member-ticket-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python SeasonCrew/member_ticket_guard_patch.py
      - name: Build bundle
        run: |
          cp SeasonCrew/app.js /tmp/app-source.js
          python -c "from pathlib import Path; p=Path('SeasonCrew/app.js'); s=p.read_text(); old=\"import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';\"; new=\"const createClient = (...args) => window.supabase.createClient(...args);\"; assert old in s; p.write_text(s.replace(old,new,1))"
          npx --yes esbuild@0.25.9 SeasonCrew/app.js --bundle --format=iife --target=safari15 --external:https://cdn.jsdelivr.net/* --outfile=SeasonCrew/app.bundle.js
          mv /tmp/app-source.js SeasonCrew/app.js
      - name: Cache bust
        run: |
          python -c "from pathlib import Path; import re; p=Path('SeasonCrew/index.html'); s=p.read_text(); s=re.sub(r'Pilot V1 · Build [^·<]+ · Multi-User','Pilot V1 · Build member-guard-1 · Multi-User',s); s=re.sub(r'app\.bundle\.js\?v=[^\"]+','app.bundle.js?v=20260817-memberguard1',s); p.write_text(s); d=Path('SeasonCrew/demo.html'); x=d.read_text(); x=re.sub(r'demo\.js\?v=[^\"]+','demo.js?v=5',x); d.write_text(x)"
      - name: Validate
        run: |
          grep -q 'bereits Ticket' SeasonCrew/app.js
          grep -q 'Dieses Mitglied hat für dieses Spiel bereits ein Ticket' SeasonCrew/app.js
          grep -q 'bereits Ticket' SeasonCrew/demo.js
          node --check SeasonCrew/app.bundle.js
          node --check SeasonCrew/demo.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SeasonCrew
          git commit -m "Prevent duplicate member assignment per match"
          git push
