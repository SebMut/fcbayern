<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SeasonCrew · Testkonten</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0f1f;color:#0a0f1f;font-family:system-ui,-apple-system,sans-serif}.card{width:min(620px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:30px}p{color:#657084;line-height:1.55}.status{margin-top:20px;padding:14px;border-radius:12px;background:#f3f5f7;font-weight:700;white-space:pre-wrap}.ok{background:#eef9f1;color:#176b3a}.err{background:#fff0f2;color:#a20f25}a{display:inline-block;margin-top:18px;color:#0a0f1f;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <h1>Testkonten erzeugen</h1>
    <p>Diese Seite funktioniert nur mit einem angemeldeten SeasonCrew-Superadmin. Sie legt zwei Admin- und zwei Gast-Testkonten an und ordnet sie sowohl Ober Pilot als auch Tom Pilot zu.</p>
    <div id="status" class="status">Testkonten werden angelegt …</div>
    <a href="./">Zurück zu SeasonCrew</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    const sb=window.supabase.createClient('https://kmhadzujovvxvpgblgkk.supabase.co','sb_publishable_JDcJGMDybnrOZcSRqtpzDg_6Ul0jr2Y',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session) throw new Error('Nicht angemeldet. Bitte zuerst SeasonCrew mit dem Superadmin-Account öffnen und dann diese Seite erneut aufrufen.');
      const {data,error}=await sb.functions.invoke('seasoncrew-seed-test-users',{body:{seed:true}});
      if(error) throw error;
      if(!data?.ok) throw new Error(data?.error||'Testkonten konnten nicht angelegt werden.');
      status.className='status ok';
      status.textContent='✓ 4 Testkonten erfolgreich angelegt.\n\n2× Admin · 2× Gast\nOber Pilot + Tom Pilot';
    }catch(e){
      status.className='status err';
      status.textContent='Fehler: '+(e?.message||String(e));
    }
  })();
  </script>
</body>
</html>
